apply plugin: 'com.android.application'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def checkedInKeys = new Properties()
def checkedInKeysFile = rootProject.file('atlas_keys.properties')
if (checkedInKeysFile.exists()) {
    checkedInKeysFile.withInputStream { stream ->
        checkedInKeys.load(stream)
    }
}

def configString = { value ->
    "\"${(value ?: '').replace('\\', '\\\\').replace('"', '\\"')}\""
}

def configValue = { envName, propertyName, fallback ->
    System.getenv(envName)
            ?: localProperties.getProperty(propertyName)
            ?: checkedInKeys.getProperty(propertyName)
            ?: fallback
}

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId "com.hry.camera.atlasofhappiness"
        minSdkVersion 22
        targetSdkVersion 28
        versionCode 20
        versionName "2.0-main"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        def speechmaticsApiKey = configValue("SPEECHMATICS_API_KEY", "speechmatics.api.key", "")
        def speechmaticsRtUrl = configValue("SPEECHMATICS_RT_URL", "speechmatics.api.url", "wss://eu2.rt.speechmatics.com/v2")
        def googleMapsApiKey = configValue("GOOGLE_MAPS_API_KEY", "google.maps.api.key", "")
        def amapApiKey = configValue("AMAP_API_KEY", "amap.api.key", "")
        def openWeatherApiKey = System.getenv("OPENWEATHER_API_KEY")
                ?: System.getenv("GOOGLE_WEATHER_API_KEY")
                ?: localProperties.getProperty("openweather.api.key")
                ?: ""
        buildConfigField "String", "SPEECHMATICS_API_KEY", configString(speechmaticsApiKey)
        buildConfigField "String", "SPEECHMATICS_RT_URL", configString(speechmaticsRtUrl)
        buildConfigField "String", "GOOGLE_MAPS_API_KEY", configString(googleMapsApiKey)
        buildConfigField "String", "AMAP_API_KEY", configString(amapApiKey)
        buildConfigField "String", "OPENWEATHER_API_KEY", configString(openWeatherApiKey)
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    repositories {
        flatDir {
            dirs 'libs'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'], exclude: ['USBCameraUtil100.jar'])
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:cardview-v7:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'

    implementation files('libs/USBCameraUtil101.jar')
}
